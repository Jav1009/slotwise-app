name: slotwise
description: SlotWise - Appointment Booking App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Flutter
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1
  
  # UI & Animations
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animations: ^2.0.8
  shimmer: ^3.0.0
  lottie: ^2.7.0
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.0
  animated_text_kit: ^4.2.2
  
  # State Management
  provider: ^6.1.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_storage: ^11.5.6
  cloud_firestore: ^4.13.6
  
  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2
  
  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.7
  
  # Utilities
  image_picker: ^1.0.5
  url_launcher: ^6.2.1
  path_provider: ^2.1.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  permission_handler: ^11.0.1
  
  # Date/Time
  table_calendar: ^3.0.9
  timeago: ^3.6.0
  jiffy: ^6.2.1
  
  # Charts & Visualizations
  fl_chart: ^0.66.0
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  flutter_native_timezone: ^2.0.0
  
  # Forms & Validation
  email_validator: ^2.1.17
  phone_numbers_parser: ^8.2.1
  
  # QR Code (for booking check-in - bonus feature)
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Maps & Location (for finding nearby services - bonus feature)
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.5

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/
  
  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  
  # Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#2A4B7C"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

# Native Splash Screen
flutter_native_splash:
  color: "#2A4B7C"
  image: assets/icons/splash_icon.png
  android: true
  ios: true
  
  android_12:
    color: "#2A4B7C"
    image: assets/icons/splash_icon_android12.png
