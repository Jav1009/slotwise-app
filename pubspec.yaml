name: slotwise
description: Appointment booking app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0
  flutter_local_notifications: 17.2.4

  # Networking & storage
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # State management
  provider: ^6.1.5+1

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  app_settings: ^7.0.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"